# Bash static analysis and format verification
name: shellcheck

on:
  pull_request:
    paths: ["**.sh", "**.bash", "**.sbatch", ".shellcheckrc"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # ShellCheck is preinstalled on ubuntu-latest runners
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh' '*.bash' '*.sbatch')
          if [ "${#files[@]}" -eq 0 ]; then echo "no shell files"; exit 0; fi
          shellcheck --shell=bash "${files[@]}"
      - name: shfmt
        env:
          SHFMT_VERSION: "3.12.0"
        run: |
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x shfmt
          mapfile -t files < <(git ls-files '*.sh' '*.bash')
          if [ "${#files[@]}" -gt 0 ]; then ./shfmt -d "${files[@]}"; fi
